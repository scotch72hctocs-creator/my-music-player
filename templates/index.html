<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Special+Elite&display=swap');

/* ===== 基本設定 ===== */
:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #171717;
  --line: #333;
  --text: #f4f4f4;
  --muted: #aaa;
  --accent: #d9d9d9;
  --app-font: "Special Elite", "Courier New", monospace;
  --body-font: "BIZ UDPGothic", "Courier New", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body-font);
}

main {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

h1, h2, h3 {
  color: #dedbd2;
  font-family: var(--app-font);
  font-weight: 400;
  letter-spacing: 0.025em;
  text-shadow: 0.5px 0.4px 0 rgba(180, 175, 160, 0.3);
  overflow-wrap: anywhere;
}

h1 {
  margin: 0 0 8px;
  font-size: 1.8rem;
  line-height: 1.4;
}

h2 {
  margin: 0 0 14px;
  font-size: 1.15rem;
  line-height: 1.5;
}

h3 {
  line-height: 1.5;
}

p, .muted {
  color: var(--muted);
}

a {
  color: #ddd;
}

/* ===== パネル・入力欄 ===== */
.panel {
  min-width: 0;
  margin: 14px 0;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

input,
select,
textarea,
button {
  min-width: 0;
  max-width: 100%;
  padding: 8px 10px;
  line-height: 1.4;
  border: 1px solid #444;
  border-radius: 9px;
  background: #0d0d0d;
  color: var(--text);
  font: inherit;
}

input,
select,
textarea {
  width: 100%;
}

button {
  cursor: pointer;
  background: #292929;
  border-color: rgba(220, 220, 220, 0.28);
  border-radius: 10px;
  font-family: var(--app-font);
  letter-spacing: 0.025em;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

button:hover {
  background: #3a3a3a;
  border-color: rgba(220, 220, 220, 0.5);
}

button:active {
  background: #505050;
  transform: scale(0.98);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.row {
  display: flex;
  min-width: 0;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.row > * {
  flex: 1 1 0;
}

.row button {
  flex: 0 1 auto;
}

.small {
  font-size: 0.9rem;
}

/* ===== 曲のカード ===== */
.song {
  min-width: 0;
  margin: 10px 0;
  padding: 14px;
  border: 1px solid rgba(220, 220, 220, 0.22);
  border-radius: 14px;
  font-family: var(--app-font);
  transition: border-color 0.2s ease;
}

.song:hover {
  border-color: rgba(220, 220, 220, 0.42);
}

.song h3 {
  margin: 0 0 8px;
  color: #eee9df;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: 0.025em;
  overflow-wrap: anywhere;
}

.song p {
  margin: 6px 0;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.song .row {
  margin-top: 12px;
}

.song .row button {
  flex: 1 1 0;
}

.pill {
  display: inline-block;
  padding: 4px 9px;
  border: 1px solid rgba(220, 220, 220, 0.3);
  border-radius: 999px;
  color: #ccc;
  font-family: var(--app-font);
  font-size: 0.8rem;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

.empty {
  padding: 16px;
  color: var(--muted);
  text-align: center;
}

.notice {
  color: #cfcfcf;
  font-size: 0.9rem;
  line-height: 1.7;
}

/* ===== アコーディオン ===== */
details.accordion {
  margin: 12px 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

details.accordion > summary {
  display: flex;
  min-height: 46px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 15px;
  color: #dedbd2;
  font-family: var(--app-font);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0.035em;
  cursor: pointer;
  list-style: none;
  touch-action: manipulation;
  transition: background-color 0.2s ease;
}

details.accordion > summary::-webkit-details-marker {
  display: none;
}

details.accordion > summary::after {
  content: "+";
  flex: 0 0 auto;
  color: #ccc;
  font-size: 1.3rem;
}

details.accordion[open] > summary::after {
  content: "−";
}

details.accordion > summary:hover {
  background-color: rgba(255, 255, 255, 0.05);
}

details.accordion > section.panel {
  margin: 0;
  padding: 18px;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
}

/* ===== 背景設定の入力欄 ===== */
#backgroundSettings label {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin: 16px 0;
  line-height: 1.7;
}

#backgroundSettings select,
#backgroundSettings input[type="color"],
#backgroundSettings input[type="file"] {
  box-sizing: border-box;
  max-width: 100%;
  margin-top: 2px;
}

#backgroundSettings select {
  box-sizing: border-box;
  height: 44px;
  min-height: 44px;
  padding: 0 10px;
  line-height: normal;
  vertical-align: middle;
}

#backgroundSettings input[type="color"] {
  width: 80px;
  height: 44px;
  padding: 4px;
}

#backgroundSettings input[type="file"] {
  min-height: 44px;
  padding: 8px;
}

/* ===== アプリ内プレーヤー ===== */
#playerPanel,
#youtubePlayer {
  min-width: 0;
  max-width: 100%;
}

#youtubePlayer iframe {
  display: block;
  max-width: 100%;
}

/* ===== 写真背景：透過率は0.42を維持 ===== */
body.photo-background .panel,
body.photo-background details.accordion,
body.photo-background .song {
  background-color: rgba(12, 12, 12, 0.42);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

/* ===== スマートフォン対応 ===== */
@media (max-width: 600px) {
  main {
    padding: 10px;
  }

  h1 {
    font-size: 1.45rem;
    line-height: 1.45;
  }

  h2 {
    font-size: 1.1rem;
    margin-bottom: 12px;
  }

  .panel {
    padding: 12px;
    margin: 12px 0;
    border-radius: 12px;
  }

  .grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }

input,
select,
textarea,
button {
  font-size: 15px;
  min-height: 44px;
  max-width: 100%;
  line-height: 1.4;
}

  button {
    -webkit-appearance: none;
    appearance: none;
  }

  .row {
    gap: 8px;
  }

  .row button {
    flex: 1 1 100%;
    white-space: normal;
  }

  .song {
    padding: 13px;
    margin: 10px 0;
  }

  .song h3 {
    font-size: 1.05rem;
    line-height: 1.6;
  }

  .song p {
    line-height: 1.65;
  }

  .song .row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .song .row button {
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 10px 6px;
    font-size: 14px;
  }

  .pill {
    margin: 2px 0;
  }

  details.accordion {
    margin: 10px 0;
  }

  details.accordion > summary {
    min-height: 44px;
    padding: 9px 13px;
    font-size: 0.95rem;
  }

  details.accordion > section.panel {
    padding: 15px;
  }

  #backgroundSettings label {
    gap: 8px;
    margin: 15px 0;
  }

  #youtubePlayer iframe {
    width: 100%;
  }
}
</style>
</head>
<body>
<main>
<header>
  <h1>♫ My Music Player</h1>
</header>
<details class="accordion" open>
  <summary>Player</summary>
  <section class="panel" id="playerPanel">
  <div id="playerMessage" class="notice"></div>
  <div id="youtubePlayer"></div>
  <div id="playerInfo" class="muted"></div>
  <div id="playlistPosition" class="muted"></div>
  </section>
</details>
<details class="accordion">
  <summary>search</summary>
  <section class="panel">
<form id="searchForm">
  <div class="grid">
    <label>曲名・歌手・アルバムなど<input id="query" placeholder="例：宇多田ヒカル First Love"></label>
    <label>年代
      <select id="decade"><option value="">指定なし</option><option>1960年代</option><option>1970年代</option><option>1980年代</option><option>1990年代</option><option>2000年代</option><option>2010年代</option><option>2020年代</option></select>
    </label>
    <label>ジャンル<select id="region"><option value="">邦楽・洋楽どちらも</option><option value="邦楽">邦楽</option><option value="洋楽">洋楽</option></select></label>
    <label>検索対象
  <select id="searchCategory">
    <option value="music" selected>音楽カテゴリ（おすすめ）</option>
    <option value="all">すべての動画</option>
  </select>
</label>
  </div>
  <div class="row" style="margin-top:10px"><button type="submit">YouTubeで検索</button></div>
</form>
  <div id="searchResults" class="search-results" aria-live="polite"></div>
 </section>
</details>

<details class="accordion">
  <summary>add</summary>
  <section class="panel">
<form id="addForm">
  <div class="grid">
    <label>曲名<input id="title" required placeholder="曲名"></label>
    <label>歌手名<input id="artist" placeholder="歌手・バンド名"></label>
    <label>アルバム名<input id="album" placeholder="アルバム名"></label>
    <label>発売年<input id="year" type="number" min="1900" max="2100" placeholder="例：1998"></label>
    <label>分類<select id="language"><option value="邦楽">邦楽</option><option value="洋楽">洋楽</option><option value="その他">その他</option></select></label>
    <label>YouTube URL
  <input id="url" type="url" placeholder="YouTubeのURLを貼り付け" >
  <small id="urlMessage" class="muted"></small>
</label>
  </div>
  <div class="row" style="margin-top:10px"><button type="submit">ライブラリに登録</button></div>
</form>
  </section>
</details>

<details class="accordion">
  <summary>My library</summary>
  <section class="panel">
<div class="grid">
<label>表示<select id="view"><option value="all">すべて</option><option value="favorites">お気に入り</option></select></label>
<label>年代で絞り込み<select id="filterDecade"><option value="">すべての年代</option><option>1960年代</option><option>1970年代</option><option>1980年代</option><option>1990年代</option><option>2000年代</option><option>2010年代</option><option>2020年代</option></select></label>
<label>邦楽・洋楽<select id="filterLanguage"><option value="">すべて</option><option>邦楽</option><option>洋楽</option><option>その他</option></select></label>
<label>キーワード<input id="filterText" placeholder="曲名・歌手・アルバム"></label>
</div>
<div id="songs"></div>
<div class="row">
<button id="exportBtn" type="button">バックアップを書き出す</button>
<button id="importBtn" type="button">バックアップを読み込む</button>
<input id="importFile" type="file" accept="application/json,.json" hidden>
</div>
  </section>
</details>

<details class="accordion">
  <summary>playlist</summary>
  <section class="panel">
<div class="row"><input id="playlistName" placeholder="新しいプレイリスト名"><button id="createPlaylist" type="button">作成</button></div>
<div id="playlists"></div>
  </section>
</details>
<details class="accordion">
  <summary>background</summary>

  <section class="panel" id="backgroundSettings">
    <label>
      背景の種類
      <select id="backgroundMode">
        <option value="solid">単色</option>
        <option value="image">写真</option>
      </select>
    </label>

    <div id="solidBackgroundSettings">
      <label>
        背景色
        <input type="color" id="backgroundColor" value="#090909">
      </label>
    </div>

    <div id="imageBackgroundSettings" hidden>
      <label>
        背景写真
        <input type="file" id="backgroundImage" accept="image/*">
      </label>
    </div>
  </section>
</details>
</main>
<script>
const KEY='mmp_free_songs_v1', PLAYKEY='mmp_free_playlists_v1';
  document.querySelectorAll('details.accordion').forEach(item => {
  item.addEventListener('toggle', () => {
    if (item.open) {
      document.querySelectorAll('details.accordion').forEach(other => {
        if (other !== item) {
          other.open = false;
        }
      });
    }
  });
});
let songs=load(KEY,[]), playlists=load(PLAYKEY,[]);
  let editingSongId = null;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
function save(){localStorage.setItem(KEY,JSON.stringify(songs));localStorage.setItem(PLAYKEY,JSON.stringify(playlists))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function decade(y){if(!y)return '';let d=Math.floor(Number(y)/10)*10;return d+'年代'}
document.getElementById('searchForm').addEventListener('submit', async e => {
  e.preventDefault();

  const query = document.getElementById('query').value.trim();
  const decade = document.getElementById('decade').value;
const region = document.getElementById('region').value;
const category = document.getElementById('searchCategory').value;

let searchQuery = query;

if (category === 'music') {
  searchQuery = [searchQuery, 'music'].filter(Boolean).join(' ');
}

const terms = [searchQuery.trim(), decade, region].filter(Boolean).join(' ');

if (!query && !decade && !region) {
  alert('曲名・歌手・年代・ジャンルのいずれかを指定してね。');
  return;
}

const resultsBox = document.getElementById('searchResults');

  resultsBox.innerHTML = '<p>検索中...</p>';

  try {
    const response = await fetch('/api/search?q=' + encodeURIComponent(terms));
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || '検索に失敗しました。');
    }

    if (!data.results || data.results.length === 0) {
      resultsBox.innerHTML = '<p>検索結果が見つかりませんでした。</p>';
      return;
    }
  
resultsBox.innerHTML = data.results.map((video, index) => `
  <div class="search-result-item" style="display:flex;gap:12px;align-items:center;margin:12px 0;padding:10px;border:1px solid #444;border-radius:8px;">
    <img src="${video.thumbnail}" alt="" style="width:120px;max-width:35%;border-radius:6px;">

    <div style="flex:1;min-width:0;">
      <div style="font-weight:bold;">${esc(video.title)}</div>
      <div>${esc(video.author)}</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <button type="button" data-preview-index="${index}">
          ▶ 再生
        </button>

        <button type="button" data-search-index="${index}">
          この曲を登録フォームに入力
        </button>
      </div>
    </div>
  </div>
`).join('');
resultsBox.querySelectorAll('[data-preview-index]').forEach(button => {
  button.addEventListener('click', () => {
    const video = data.results[Number(button.dataset.previewIndex)];

    playInApp({
      title: video.title,
      artist: video.author,
      url: video.videoUrl
    });
  });
});
    resultsBox.querySelectorAll('[data-search-index]').forEach(button => {
      button.addEventListener('click', () => {
        const video = data.results[Number(button.dataset.searchIndex)];

        document.getElementById('title').value = video.title;
        document.getElementById('artist').value = video.author;
        document.getElementById('url').value = video.videoUrl;

        document.getElementById('url').dispatchEvent(
          new Event('change', { bubbles: true })
        );
        const addForm = document.getElementById('addForm');
        const registerAccordion = addForm.closest('details.accordion');

        if (registerAccordion) {
          registerAccordion.open = true;
        }

        addForm.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      });
    });

  } catch (error) {
    resultsBox.innerHTML = '<p>' + esc(error.message) + '</p>';
  }
});

const urlInput = document.getElementById('url');
const urlMessage = document.getElementById('urlMessage');

function getYouTubeVideoId(value) {
  try {
    const parsed = new URL(value);
    const host = parsed.hostname.toLowerCase().replace(/^www\./, '');

    if (host === 'youtu.be') {
      return parsed.pathname.split('/').filter(Boolean)[0] || null;
    }

    if (
      host === 'youtube.com' ||
      host === 'm.youtube.com' ||
      host === 'music.youtube.com' ||
      host === 'youtube-nocookie.com'
    ) {
      if (parsed.pathname === '/watch') {
        return parsed.searchParams.get('v');
      }

      const match = parsed.pathname.match(/^\/(embed|shorts|live)\/([^/]+)/);
      return match ? match[2] : null;
    }

    return null;
  } catch {
    return null;
  }
}

urlInput.addEventListener('input', () => {
  const value = urlInput.value.trim();

  if (!value) {
    urlMessage.textContent = '';
    return;
  }

  const videoId = getYouTubeVideoId(value);

  if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    urlMessage.textContent = '✓ YouTubeの動画IDを確認しました。';
  } else {
    urlMessage.textContent = 'URLを確認してください。YouTubeの動画URLを入力してね。';
  }
});
  urlInput.addEventListener('change', async () => {
  const value = urlInput.value.trim();
  const videoId = getYouTubeVideoId(value);

  if (!videoId || !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    return;
  }

  urlMessage.textContent = '動画情報を取得しています...';

  try {
    const oembedUrl =
      'https://www.youtube.com/oembed?url=' +
      encodeURIComponent(
        'https://www.youtube.com/watch?v=' + videoId
      ) +
      '&format=json';

    const response = await fetch(oembedUrl);

    if (!response.ok) {
      throw new Error('動画情報を取得できませんでした');
    }

    const data = await response.json();
    const titleField = document.getElementById('title');
    const artistField = document.getElementById('artist');

    if (titleField && !titleField.value.trim()) {
      titleField.value = data.title || '';
    }

    if (artistField && !artistField.value.trim()) {
      artistField.value = data.author_name || '';
    }

    urlMessage.textContent =
      '✓ 情報を取得しました。曲名と投稿者名を確認してください。';
  } catch {
    urlMessage.textContent =
      '動画IDは確認できましたが、情報を取得できませんでした。手入力してください。';
  }
});
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();

  const titleField = document.getElementById('title');
  const artistField = document.getElementById('artist');
  const albumField = document.getElementById('album');
  const yearField = document.getElementById('year');
  const languageField = document.getElementById('language');
  const urlField = document.getElementById('url');

  const songUrl = urlField.value.trim();
  const videoId = getYouTubeVideoId(songUrl);

  if (videoId) {
    const alreadyExists = songs.some(song => {
      return song.id !== editingSongId &&
        getYouTubeVideoId(song.url || '') === videoId;
    });

    if (alreadyExists) {
      alert('このYouTube動画はすでに登録されています。');
      return;
    }
  }

  const songData = {
    title: titleField.value.trim(),
    artist: artistField.value.trim(),
    album: albumField.value.trim(),
    year: yearField.value,
    language: languageField.value,
    url: songUrl
  };

  if (editingSongId) {
    const song = songs.find(s => s.id === editingSongId);

    if (song) {
      Object.assign(song, songData);
    }

    editingSongId = null;
  } else {
    songs.unshift({
      id: Date.now().toString(),
      ...songData,
      favorite: false
    });
  }

  save();
  e.target.reset();

  const submitButton = e.target.querySelector(
    'button[type="submit"], input[type="submit"]'
  );
  if (submitButton) submitButton.textContent = '曲を登録';

  render();
});
  let currentPlaylistSongs = [];
let currentPlaylistIndex = -1;
  let isShuffleMode = false;
  let ytPlayer = null;
let ytApiPromise = null;

function loadYouTubeIframeAPI() {
  if (window.YT && window.YT.Player) {
    return Promise.resolve();
  }

  if (ytApiPromise) {
    return ytApiPromise;
  }

  ytApiPromise = new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = () => resolve();

    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => {
      ytApiPromise = null;
      reject(new Error('YouTube APIを読み込めませんでした'));
    };

    document.head.appendChild(script);
  });

  return ytApiPromise;
}
async function playInApp(song) {
  const message = document.getElementById('playerMessage');
  const player = document.getElementById('youtubePlayer');
  const info = document.getElementById('playerInfo');
  const position = document.getElementById('playlistPosition');
  const playerPanel = document.getElementById('playerPanel');
  const playerAccordion = playerPanel.closest('details.accordion');

  if (playerAccordion) {
    playerAccordion.open = true;
  }

  if (
    currentPlaylistSongs.length > 0 &&
    currentPlaylistIndex >= 0
  ) {
    position.textContent =
      `プレイリスト再生：${currentPlaylistIndex + 1} / ${currentPlaylistSongs.length} 曲目`;
  } else {
    position.textContent = '';
  }

  const videoId = getYouTubeVideoId(song.url || '');

  if (!videoId || !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    message.textContent = '有効なYouTube動画URLを登録してね。';
    player.replaceChildren();
    info.textContent = '';
    return;
  }

  message.textContent = '再生プレーヤーを読み込み中…';
  info.textContent = song.title + (song.artist ? ' / ' + song.artist : '');

if (!document.getElementById('youtubePlayerFrame')) {
  const mount = document.createElement('div');
  mount.id = 'youtubePlayerFrame';
  player.appendChild(mount);
}

  document.getElementById('playerPanel')
    .scrollIntoView({ behavior: 'smooth', block: 'start' });

try {
    if (ytPlayer) {
      ytPlayer.loadVideoById(videoId);
      ytPlayer.playVideo();
      message.textContent = '曲を切り替えています…';
      return;
    }

    await loadYouTubeIframeAPI();
    ytPlayer = new YT.Player('youtubePlayerFrame', {
      width: '100%',
      height: '220',
      videoId: videoId,
playerVars: {
  playsinline: 1,
  rel: 0,
  fs: 1,
  autoplay: 1
},
      events: {
onReady: () => {
  message.textContent = '再生を開始します…';
  ytPlayer.playVideo();
},
onAutoplayBlocked: () => {
  message.textContent =
    '自動再生が制限されました。画面内の再生ボタンを押してね。';
},
onStateChange: event => {
  if (event.data === YT.PlayerState.PLAYING) {
    message.textContent = '再生中です♪';
  }

  if (event.data === YT.PlayerState.ENDED) {
    message.textContent = '曲が終了しました。次の曲を読み込みます…';

    if (
      currentPlaylistSongs.length &&
      currentPlaylistIndex >= 0 &&
      currentPlaylistIndex < currentPlaylistSongs.length
    ) {
      const isLastSong =
        currentPlaylistIndex === currentPlaylistSongs.length - 1;

      if (isLastSong && isShuffleMode && currentPlaylistSongs.length > 1) {
        const previousSongId =
          currentPlaylistSongs[currentPlaylistIndex].id;

        for (let i = currentPlaylistSongs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          [
            currentPlaylistSongs[i],
            currentPlaylistSongs[j]
          ] = [
            currentPlaylistSongs[j],
            currentPlaylistSongs[i]
          ];
        }

        if (currentPlaylistSongs[0].id === previousSongId) {
          const differentIndex = currentPlaylistSongs.findIndex(
            (song, index) => index > 0 && song.id !== previousSongId
          );

          if (differentIndex > 0) {
            [
              currentPlaylistSongs[0],
              currentPlaylistSongs[differentIndex]
            ] = [
              currentPlaylistSongs[differentIndex],
              currentPlaylistSongs[0]
            ];
          }
        }

        currentPlaylistIndex = 0;
      } else {
        currentPlaylistIndex =
          (currentPlaylistIndex + 1) % currentPlaylistSongs.length;
      }

      const nextSong = currentPlaylistSongs[currentPlaylistIndex];

      if (nextSong && nextSong.url) {
        playInApp(nextSong);
      } else {
        message.textContent =
          '次の曲にYouTube URLが登録されていません。';
      }
    } else {
      message.textContent =
        '曲が終了しました。プレイリストを選択すると自動で次の曲へ進めます。';
    }
  }
},
        onError: () => {
          message.textContent =
            'この動画は埋め込み再生できない可能性があります。';
        }
      }
    });
  } catch (error) {
    message.textContent =
      'YouTubeプレーヤーを読み込めませんでした。ページを再読み込みしてね。';
  }
}

document.getElementById('playlists').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;

  const p = playlists.find(x => x.id === b.dataset.id);
  if (!p) return;

  if (b.dataset.plact === 'delete') {
    if (!confirm('このプレイリストを削除しますか？')) return;

    playlists = playlists.filter(x => x.id !== p.id);

    if (currentPlaylistSongs.length &&
        currentPlaylistSongs.every(s => p.songIds.includes(s.id))) {
      currentPlaylistSongs = [];
      currentPlaylistIndex = -1;
    }

    save();
    render();
    return;
  }

  if (b.dataset.plact === 'open') {
    const list = document.querySelector(
      `[data-plsongs="${p.id}"]`
    );

    if (list) list.hidden = !list.hidden;
    return;
  }

  const playlistSongs = p.songIds
    .map(id => songs.find(s => s.id === id))
    .filter(Boolean);

  if (b.dataset.plact === 'play') {
    const index = playlistSongs.findIndex(
      s => s.id === b.dataset.songid
    );

    if (index < 0) {
      alert('この曲は見つかりませんでした。');
      return;
    }

    currentPlaylistSongs = playlistSongs;
    currentPlaylistIndex = index;
    playInApp(currentPlaylistSongs[currentPlaylistIndex]);
    return;
  }

if (
    b.dataset.plact === 'prev' ||
    b.dataset.plact === 'next' ||
    b.dataset.plact === 'shuffle'
  ) {
    if (!playlistSongs.length) {
      alert('このプレイリストには曲がありません。');
      return;
    }

    if (b.dataset.plact === 'shuffle') {
      isShuffleMode = true;
      currentPlaylistSongs = [...playlistSongs];

      for (let i = currentPlaylistSongs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [
          currentPlaylistSongs[i],
          currentPlaylistSongs[j]
        ] = [
          currentPlaylistSongs[j],
          currentPlaylistSongs[i]
        ];
      }

currentPlaylistIndex = 0;

// 同じ曲が連続している場合は、2曲目以降と入れ替える
if (currentPlaylistSongs.length > 1) {
  const firstId = currentPlaylistSongs[0].id;

  if (currentPlaylistSongs[1].id === firstId) {
    const differentIndex = currentPlaylistSongs.findIndex(
      (song, index) => index > 1 && song.id !== firstId
    );

    if (differentIndex > 0) {
      [
        currentPlaylistSongs[1],
        currentPlaylistSongs[differentIndex]
      ] = [
        currentPlaylistSongs[differentIndex],
        currentPlaylistSongs[1]
      ];
    }
  }
}

const firstSong = currentPlaylistSongs[0];

      if (!firstSong.url) {
        alert('最初の曲にYouTubeのURLが登録されていません。');
        return;
      }

      playInApp(firstSong);
      return;
    }

    const samePlaylist =
      currentPlaylistSongs.length === playlistSongs.length &&
      currentPlaylistSongs.every(
        (s, i) => s.id === playlistSongs[i].id
      );

    if (!samePlaylist) {
      currentPlaylistSongs = playlistSongs;
      currentPlaylistIndex =
        b.dataset.plact === 'next' ? -1 : 0;
    }

    if (b.dataset.plact === 'next') {
      currentPlaylistIndex =
        (currentPlaylistIndex + 1) % currentPlaylistSongs.length;
    } else {
      currentPlaylistIndex =
        (currentPlaylistIndex - 1 + currentPlaylistSongs.length) %
        currentPlaylistSongs.length;
    }

    const song = currentPlaylistSongs[currentPlaylistIndex];

    if (!song.url) {
      alert('この曲にはYouTubeのURLが登録されていません。曲を編集してURLを登録してね。');
      return;
    }

    playInApp(song);
  }
});

const backgroundMode = document.getElementById('backgroundMode');
const backgroundColor = document.getElementById('backgroundColor');
const backgroundImage = document.getElementById('backgroundImage');
const solidSettings = document.getElementById('solidBackgroundSettings');
const imageSettings = document.getElementById('imageBackgroundSettings');

function applyBackground() {
  const isImage = backgroundMode.value === 'image';
  document.body.classList.toggle('photo-background', isImage);

  solidSettings.hidden = isImage;
  imageSettings.hidden = !isImage;

  if (isImage) {
    document.body.style.backgroundImage = 
      document.body.dataset.backgroundImage || 'none';

    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = backgroundColor.value;
  }
}

backgroundMode.addEventListener('change', applyBackground);

backgroundColor.addEventListener('input', applyBackground);

backgroundImage.addEventListener('change', () => {
  const file = backgroundImage.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('画像ファイルを選んでね。');
    backgroundImage.value = '';
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    document.body.dataset.backgroundImage = 
      `url("${reader.result}")`;

    applyBackground();
  };

  reader.readAsDataURL(file);
});

    localStorage.setItem('myMusicPlayerBackgroundMode', backgroundMode.value);
    localStorage.setItem('myMusicPlayerBackgroundColor', backgroundColor.value);
  } catch (error) {
    console.warn('背景設定を保存できませんでした。');
  }
}

function loadBackgroundSettings() {
  try {
    const savedMode = localStorage.getItem('myMusicPlayerBackgroundMode');
    const savedColor = localStorage.getItem('myMusicPlayerBackgroundColor');

    if (savedMode === 'solid' || savedMode === 'image') {
      backgroundMode.value = savedMode;
    }

    if (savedColor && /^#[0-9a-fA-F]{6}$/.test(savedColor)) {
      backgroundColor.value = savedColor;
    }
  } catch (error) {
    console.warn('背景設定を読み込めませんでした。');
  }
}

const BACKGROUND_DB_NAME = 'myMusicPlayerBackgroundDB';
const BACKGROUND_STORE_NAME = 'settings';
const BACKGROUND_IMAGE_KEY = 'backgroundImage';

function openBackgroundDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(BACKGROUND_DB_NAME, 1);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(BACKGROUND_STORE_NAME)) {
        db.createObjectStore(BACKGROUND_STORE_NAME);
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveBackgroundImage(file) {
  const db = await openBackgroundDB();

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(
      BACKGROUND_STORE_NAME,
      'readwrite'
    );

    transaction.objectStore(BACKGROUND_STORE_NAME).put(
      file,
      BACKGROUND_IMAGE_KEY
    );

    transaction.oncomplete = () => {
      db.close();
      resolve();
    };

    transaction.onerror = () => {
      db.close();
      reject(transaction.error);
    };

    transaction.onabort = () => {
      db.close();
      reject(transaction.error);
    };
  });
}

async function loadBackgroundImage() {
  const db = await openBackgroundDB();

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(
      BACKGROUND_STORE_NAME,
      'readonly'
    );

    const request = transaction.objectStore(
      BACKGROUND_STORE_NAME
    ).get(BACKGROUND_IMAGE_KEY);

    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);

    transaction.oncomplete = () => db.close();
    transaction.onerror = () => db.close();
  });
}

function showBackgroundImage(dataUrl) {
  document.body.dataset.backgroundImage = `url("${dataUrl}")`;
}

backgroundImage.addEventListener('change', async () => {
  const file = backgroundImage.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('画像ファイルを選んでね。');
    backgroundImage.value = '';
    return;
  }

  try {
    await saveBackgroundImage(file);

    const reader = new FileReader();

    reader.onload = () => {
      showBackgroundImage(reader.result);
      backgroundMode.value = 'image';
      applyBackground();
      saveBackgroundSettings();
    };

    reader.onerror = () => {
      alert('写真を読み込めませんでした。');
    };

    reader.readAsDataURL(file);
  } catch (error) {
    alert('写真を保存できませんでした。別の写真で試してね。');
  }
});

async function restoreBackgroundImage() {
  try {
    const savedImage = await loadBackgroundImage();

    if (savedImage) {
      const reader = new FileReader();

      reader.onload = () => {
        showBackgroundImage(reader.result);
        applyBackground();
      };

      reader.readAsDataURL(savedImage);
    } else {
      applyBackground();
    }
  } catch (error) {
    console.warn('背景写真を復元できませんでした。');
    applyBackground();
  }
}

loadBackgroundSettings();
restoreBackgroundImage();
