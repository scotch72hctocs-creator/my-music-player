<!doctype html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Special+Elite&display=swap');

:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #171717;
  --line: #333;
  --text: #f4f4f4;
  --muted: #aaa;
  --accent: #d9d9d9;
  --app-font: "Special Elite", "Courier New", monospace;
  --body-font: "BIZ UDPGothic", "Courier New", monospace;
  --base-font-size: 13px;
}

* { box-sizing: border-box; }

html, body {
  max-width: 100%;
  margin: 0;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body-font);
}

main {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

h1, h2, h3 {
  color: #dedbd2;
  font-family: var(--app-font);
  font-weight: 400;
  letter-spacing: .025em;
  text-shadow: .5px .4px 0 rgba(180, 175, 160, .3);
  overflow-wrap: anywhere;
}

h1 { margin: 0 0 8px; font-size: 1.8rem; line-height: 1.4; }
h2 { margin: 0 0 14px; font-size: 1.15rem; line-height: 1.5; }
h3 { line-height: 1.5; }
p, .muted { color: var(--muted); }
a { color: #ddd; }

.panel {
  min-width: 0;
  margin: 14px 0;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

input, select, textarea, button {
  min-width: 0;
  max-width: 100%;
  padding: 6px 10px;
  line-height: 1.4;
  border: 1px solid #444;
  border-radius: 9px;
  background: #0d0d0d;
  color: var(--text);
  font: inherit;
}

input, select, textarea { width: 100%; }

button {
  cursor: pointer;
  background: #292929;
  border-color: rgba(220, 220, 220, .28);
  border-radius: 10px;
  font-family: var(--app-font);
  letter-spacing: .025em;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s ease, border-color .2s ease;
}

button:hover { background: #3a3a3a; border-color: rgba(220, 220, 220, .5); }
button:active { background: #505050; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.row {
  display: flex;
  min-width: 0;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.row > * { flex: 1 1 0; }
.row button { flex: 0 1 auto; }
.small { font-size: .9rem; }

.song {
  min-width: 0;
  margin: 8px 0;
  padding: 12px;
  border: 1px solid rgba(220, 220, 220, .22);
  border-radius: 14px;
  font-family: var(--app-font);
  transition: border-color .2s ease;
}

.song:hover { border-color: rgba(220, 220, 220, .42); }
.song h3 {
  margin: 0 0 6px;
  color: #eee9df;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: .025em;
  overflow-wrap: anywhere;
}
.song p { margin: 6px 0; line-height: 1.65; overflow-wrap: anywhere; }
.song .row { margin-top: 12px; }
.song .row button { flex: 1 1 0; }

.pill {
  display: inline-block;
  padding: 4px 9px;
  border: 1px solid rgba(220, 220, 220, .3);
  border-radius: 999px;
  color: #ccc;
  font-family: var(--app-font);
  font-size: .8rem;
  line-height: 1.5;
  letter-spacing: .02em;
}

.empty { padding: 16px; color: var(--muted); text-align: center; }
.notice { color: #cfcfcf; font-size: var(--base-font-size); line-height: 1.7; }

details.accordion {
  margin: 12px 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

details.accordion > :not(summary) { font-size: var(--base-font-size); }
details.accordion > summary {
  display: flex;
  min-height: 46px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 15px;
  color: #dedbd2;
  font-family: var(--app-font);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: .035em;
  cursor: pointer;
  list-style: none;
  touch-action: manipulation;
  transition: background-color .2s ease;
}
details.accordion > summary::-webkit-details-marker { display: none; }
details.accordion > summary::after {
  content: "+";
  flex: 0 0 auto;
  color: #ccc;
  font-size: 1.3rem;
}
details.accordion[open] > summary::after { content: "−"; }
/* 編集フォームは編集時だけ表示 */
details#addAccordion:not([open]) { display: none; }
details.accordion > summary:hover { background-color: rgba(255, 255, 255, .05); }
details.accordion > section.panel {
  margin: 0;
  padding: 15px;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
}

#backgroundSettings label {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin: 16px 0;
  line-height: 1.7;
}
#backgroundSettings select, #backgroundSettings input[type="color"], #backgroundSettings input[type="file"] {
  box-sizing: border-box;
  max-width: 100%;
  margin-top: 2px;
}
#backgroundSettings select {
  height: 44px;
  min-height: 44px;
  padding: 0 10px;
  line-height: normal;
  vertical-align: middle;
}
#backgroundSettings input[type="color"] { width: 80px; height: 44px; padding: 4px; }
#backgroundSettings input[type="file"] { min-height: 44px; padding: 8px; }

#playerPanel, #youtubePlayer { min-width: 0; max-width: 100%; }
#youtubePlayer iframe { display: block; max-width: 100%; }

body.photo-background .panel,
body.photo-background details.accordion,
body.photo-background .song {
  background-color: rgba(12, 12, 12, .42);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

@media (max-width: 600px) {
  main { padding: 10px; }
  h1 { font-size: 1.45rem; line-height: 1.45; }
  h2 { margin-bottom: 12px; font-size: 1.1rem; }
  .panel { margin: 12px 0; padding: 12px; border-radius: 12px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }

input, select, textarea, button {
    max-width: 100%;
    line-height: 1.4;
}

input, select, textarea {
    font-size: 16px;
}

button {
    font-size: var(--base-font-size);
}
  
  input, select, textarea {
    min-height: 44px;
  }

  button {
    min-height: 40px;
    padding-top: 4px;
    padding-bottom: 4px;
  }
  
  button { -webkit-appearance: none; appearance: none; }
  .row { gap: 8px; }
  .row button { flex: 1 1 100%; white-space: normal; }
  .song { margin: 8px 0; padding: 12px; }
  .song h3 { font-size: 1.05rem; line-height: 1.6; }
  .song p { line-height: 1.65; }
  .song .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .song .row button { width: 100%; min-width: 0; min-height: 44px; padding: 6px 6px; }
  .pill { margin: 2px 0; }
  details.accordion { margin: 10px 0; }
  details.accordion > summary { min-height: 44px; padding: 7px 13px; font-size: .95rem; }
  details.accordion > section.panel { padding: 15px; }
  #backgroundSettings label { gap: 8px; margin: 15px 0; }
  #youtubePlayer iframe { width: 100%; }
}
  
#searchResults {
  max-height: 450px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  width: 100%;
  box-sizing: border-box;
}

#searchResults * {
  max-width: 100%;
  box-sizing: border-box;
}

.playlist-song-title {
  overflow-wrap: anywhere;
  line-height: 1.3;
}
  
  /* 曲ごとの操作ボタンを横並びにする */
.playlist-song-edit {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.playlist-song-edit > button[data-plact="play"] {
  flex: 1;
  min-width: 0;
}

/* プレイリスト操作ボタンを2列×2段にする */
#playlists .row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

#playlists .row button {
  width: 100%;
  min-width: 0;
}

.playlist-song-order,
.playlist-song-remove {
  flex: 1;
  min-width: 0;
}

.playlist-song-order {
  display: flex;
  gap: 8px;
}

.playlist-song-order button {
  flex: 1;
  min-width: 0;
}

  /* プレイリスト全体を独立して表示 */
.playlist-item {
  border: none;
  box-shadow: none;
  background: transparent;
  padding: 12px 0;
  margin-bottom: 12px;
}

/* プレイリスト名の枠をなくす */
.playlist-toggle {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  box-shadow: none;
  background: transparent;
  padding: 10px 0;
  font-weight: bold;
}

/* プレイリストの操作ボタンとの間に区切り線 */
.playlist-item > .row {
  border-bottom: 1px solid #444;
  padding-bottom: 12px;
  margin-bottom: 12px;
}

/* 曲ごとの区切り線 */
.playlist-song-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-bottom: 1px solid #444;
  padding: 8px 0;
}

.song.selected {
  border: 1px solid #75D6A5;
  border-radius: 8px;
  background: rgba(117, 214, 165, 0.08);
  padding: 8px;
}

.playlist-song-title.selected {
  border: 1px solid #75D6A5;
  border-radius: 8px;
  background: rgba(117, 214, 165, 0.08);
  padding: 8px;
}
  
  .playing-badge {
  display: inline-block;
  color: #75D6A5;
  background: #18382B;
  border: 1px solid #347A59;
  border-radius: 5px;
  padding: 3px 7px;
  margin-right: 6px;
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

  /* プレイリスト選択画面 */
#playlistSelectModal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.75);
}

#playlistSelectModal[hidden] {
  display: none;
}

.playlist-select-panel {
  width: 100%;
  max-width: 360px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #444;
  border-radius: 14px;
  background: #171717;
  color: #fff;
  box-sizing: border-box;
}

.playlist-select-panel h3 {
  margin: 0 0 12px;
}

.playlist-select-panel p {
  margin: 0 0 16px;
  font-size: 13px;
  color: #ccc;
}

#playlistSelectOptions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#playlistSelectOptions button,
#playlistSelectCancel {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #292929;
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

#playlistSelectOptions button:active,
#playlistSelectCancel:active {
  background: #444;
}

#playlistSelectCancel {
  margin-top: 14px;
  background: #1c1c1c;
}
  
</style>
</head>
<body>
<main>
  <header><h1>♫ My Music Player</h1></header>

  <details class="accordion" open>
    <summary>Player</summary>
    <section class="panel" id="playerPanel">
      <div id="playerMessage" class="notice"></div>
      <div id="youtubePlayer"></div>
      <div id="playerInfo" class="muted"></div>
      <div id="playlistPosition" class="muted"></div>
    </section>
  </details>

  <details class="accordion">
    <summary>search</summary>
    <section class="panel">
      <form id="searchForm">
        <div class="grid">
          <label>曲名・歌手・アルバムなど
            <input id="query" placeholder="検索ワード">
          </label>
          <label>年代
            <select id="decade">
              <option value="">指定なし</option>
              <option>1960年代</option><option>1970年代</option><option>1980年代</option>
              <option>1990年代</option><option>2000年代</option><option>2010年代</option><option>2020年代</option>
            </select>
          </label>
          <label>ジャンル
            <select id="region">
              <option value="">邦楽・洋楽どちらも</option>
              <option value="邦楽">邦楽</option><option value="洋楽">洋楽</option>
            </select>
          </label>
          <label>検索対象
            <select id="searchCategory">
              <option value="music" selected>音楽カテゴリ（おすすめ）</option>
              <option value="all">すべての動画</option>
            </select>
          </label>
        </div>
        <div class="row" style="margin-top:10px"><button type="submit">YouTubeで検索</button></div>
      </form>
      <div id="searchResults" aria-live="polite"></div>
    </section>
  </details>

  <details class="accordion" id="addAccordion">
    <summary>曲の編集</summary>
    <section class="panel">
      <form id="addForm">
        <div class="grid">
          <label>曲名<input id="title" required placeholder="曲名"></label>
          <label>歌手名<input id="artist" placeholder="歌手・バンド名"></label>
          <label>アルバム名<input id="album" placeholder="アルバム名"></label>
          <label>発売年<input id="year" type="number" min="1900" max="2100" placeholder="例：1998"></label>
          <label>分類
            <select id="language"><option value="邦楽">邦楽</option><option value="洋楽">洋楽</option><option value="その他">その他</option></select>
          </label>
          <label>YouTube URL
            <input id="url" type="url" placeholder="YouTubeのURLを貼り付け">
            <small id="urlMessage" class="muted"></small>
          </label>
        </div>
        <div class="row" style="margin-top:10px"><button type="submit">変更を保存</button></div>
      </form>
    </section>
  </details>

  <details class="accordion">
    <summary>My library</summary>
    <section class="panel">
      <div class="grid">
        <label>表示<select id="view"><option value="all">すべて</option><option value="favorites">お気に入り</option></select></label>
        <label>年代で絞り込み
          <select id="filterDecade">
            <option value="">すべての年代</option>
            <option>1960年代</option><option>1970年代</option><option>1980年代</option>
            <option>1990年代</option><option>2000年代</option><option>2010年代</option><option>2020年代</option>
          </select>
        </label>
        <label>邦楽・洋楽
          <select id="filterLanguage"><option value="">すべて</option><option>邦楽</option><option>洋楽</option><option>その他</option></select>
        </label>
        <label>キーワード<input id="filterText" placeholder="曲名・歌手・アルバム"></label>
      </div>
      <div class="row" style="margin-bottom:10px">
        <button id="libraryShuffleBtn" type="button">ライブラリをランダム再生</button>
      </div>
      <div id="songs"></div>
      <div class="row">
        <button id="exportBtn" type="button">バックアップを書き出す</button>
        <button id="importBtn" type="button">バックアップを読み込む</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </section>
  </details>

  <details class="accordion">
    <summary>playlist</summary>
    <section class="panel">
      <div class="row"><input id="playlistName" placeholder="新しいプレイリスト名"><button id="createPlaylist" type="button">作成</button></div>
      <div id="playlists"></div>
    </section>
  </details>

  <details class="accordion">
    <summary>background</summary>
    <section class="panel" id="backgroundSettings">
      <label>背景の種類
        <select id="backgroundMode"><option value="solid">単色</option><option value="image">写真</option></select>
      </label>
      <div id="solidBackgroundSettings">
        <label>背景色<input type="color" id="backgroundColor" value="#090909"></label>
      </div>
      <div id="imageBackgroundSettings" hidden>
        <label>背景写真<input type="file" id="backgroundImage" accept="image/*"></label>
      </div>
    </section>
  </details>
</main>

<script>
'use strict';

const SONGS_KEY = 'mmp_free_songs_v1';
const PLAYLISTS_KEY = 'mmp_free_playlists_v1';
const BG_MODE_KEY = 'myMusicPlayerBackgroundMode';
const BG_COLOR_KEY = 'myMusicPlayerBackgroundColor';
const BG_DB_NAME = 'myMusicPlayerBackgroundDB';
const BG_STORE_NAME = 'settings';
const BG_IMAGE_KEY = 'backgroundImage';
const LAST_PLAYED_KEY = 'mmp_last_played_song_v1';

function load(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
}

let songs = load(SONGS_KEY, []);
let playlists = load(PLAYLISTS_KEY, []);
let editingSongId = null;
let selectedSongId = null;
function selectSong(songId) {
  selectedSongId = songId;
}

function isSongSelected(songId) {
  return String(selectedSongId) === String(songId);
}
function isSongPlaying(songId) {
  return (
    currentPlaylistSongs.length > 0 &&
    currentPlaylistIndex >= 0 &&
    String(currentPlaylistSongs[currentPlaylistIndex]?.id) === String(songId)
  );
}
let currentPlaylistSongs = [];
let currentPlaylistIndex = -1;
let isShuffleMode = false;
let ytPlayer = null;
let ytApiPromise = null;
let wasPlayingBeforeFullscreen = false;

function save() {
  localStorage.setItem(SONGS_KEY, JSON.stringify(songs));
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function decade(year) {
  if (!year) return '';
  return `${Math.floor(Number(year) / 10) * 10}年代`;
}

function getYouTubeVideoId(value) {
  try {
    const parsed = new URL(value);
    const host = parsed.hostname.toLowerCase().replace(/^www\./, '');

    if (host === 'youtu.be') return parsed.pathname.split('/').filter(Boolean)[0] || null;

    if (['youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtube-nocookie.com'].includes(host)) {
      if (parsed.pathname === '/watch') return parsed.searchParams.get('v');
      const match = parsed.pathname.match(/^\/(embed|shorts|live)\/([^/]+)/);
      return match ? match[2] : null;
    }
    return null;
  } catch {
    return null;
  }
}

function isValidYouTubeId(id) {
  return typeof id === 'string' && /^[a-zA-Z0-9_-]{11}$/.test(id);
}

/* アコーディオンは同時に1つだけ開く */
document.querySelectorAll('details.accordion').forEach(item => {
  item.addEventListener('toggle', () => {
    if (!item.open) return;

    // Playerを開いたときは、ほかのアコーディオンを閉じない
    if (item.querySelector('#playerPanel')) return;

    document.querySelectorAll('details.accordion').forEach(other => {
      if (other !== item) other.open = false;
    });
  });
});

/* YouTube検索 */
document.getElementById('searchForm').addEventListener('submit', async event => {
  event.preventDefault();

  const query = document.getElementById('query').value.trim();
  const selectedDecade = document.getElementById('decade').value;
  const region = document.getElementById('region').value;
  const category = document.getElementById('searchCategory').value;

  if (!query && !selectedDecade && !region) {
    alert('曲名・歌手・年代・ジャンルのいずれかを指定してね。');
    return;
  }

  const searchQuery = [
    query,
    category === 'music' ? 'music' : '',
    selectedDecade,
    region
  ].filter(Boolean).join(' ');

  const resultsBox = document.getElementById('searchResults');
  resultsBox.innerHTML = '<p>検索中...</p>';

  try {
    const response = await fetch('/api/search?q=' + encodeURIComponent(searchQuery));
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '検索に失敗しました。');

    if (!Array.isArray(data.results) || !data.results.length) {
      resultsBox.innerHTML = '<p>検索結果が見つかりませんでした。</p>';
      return;
    }
　const registeredVideoIds = new Set(
  songs
    .map(song => getYouTubeVideoId(song.url || ''))
    .filter(Boolean)
);
    
    resultsBox.innerHTML = data.results.map((video, index) => `
      <div class="search-result-item" style="display:flex;gap:12px;align-items:center;margin:12px 0;padding:10px;border:1px solid #444;border-radius:8px;">
        <img src="${esc(video.thumbnail)}" alt="" loading="lazy" style="width:120px;max-width:35%;border-radius:6px;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:bold;">${esc(video.title)}</div>
          <div>${esc(video.author)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button type="button" data-preview-index="${index}">▶ 再生</button>
<button
  type="button"
  data-search-index="${index}"
  ${registeredVideoIds.has(getYouTubeVideoId(video.videoUrl || '')) ? 'disabled' : ''}
>${registeredVideoIds.has(getYouTubeVideoId(video.videoUrl || '')) ? '追加済み' : 'ライブラリへ'}</button>
          </div>
        </div>
      </div>
    `).join('');

    resultsBox.querySelectorAll('[data-preview-index]').forEach(button => {
      button.addEventListener('click', () => {
        const video = data.results[Number(button.dataset.previewIndex)];
        playInApp({ title: video.title, artist: video.author, url: video.videoUrl });
      });
    });

    resultsBox.querySelectorAll('[data-search-index]').forEach(button => {
      button.addEventListener('click', () => {
        const video = data.results[Number(button.dataset.searchIndex)];
        const videoId = getYouTubeVideoId(video.videoUrl || '');

        if (!isValidYouTubeId(videoId)) {
          alert('この検索結果のYouTube動画URLを確認できませんでした。');
          return;
        }

        const existingSong = songs.find(song =>
          getYouTubeVideoId(song.url || '') === videoId
        );

        if (existingSong) {
          button.textContent = '追加済み';
          button.disabled = true;
          return;
        }

        songs.unshift({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
          title: video.title || '',
          artist: video.author || '',
          album: '',
          year: '',
          language: region || 'その他',
          url: video.videoUrl,
          favorite: false
        });

        save();
        render();
        button.textContent = '追加済み';
        button.disabled = true;
      });
    });
  } catch (error) {
    resultsBox.innerHTML = `<p>${esc(error.message)}</p>`;
  }
});

/* YouTube IFrame API */
function loadYouTubeIframeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;

  ytApiPromise = new Promise((resolve, reject) => {
    window.onYouTubeIframeAPIReady = () => resolve();
    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => {
      ytApiPromise = null;
      reject(new Error('YouTube APIを読み込めませんでした'));
    };
    document.head.appendChild(script);
  });
  return ytApiPromise;
}

async function playInApp(song) {
  const message = document.getElementById('playerMessage');
  const playerRoot = document.getElementById('youtubePlayer');
  const info = document.getElementById('playerInfo');
  const position = document.getElementById('playlistPosition');
  const playerAccordion = document.getElementById('playerPanel').closest('details.accordion');

  playerAccordion.open = true;

  position.textContent = currentPlaylistSongs.length > 0 && currentPlaylistIndex >= 0
    ? `プレイリスト再生：${currentPlaylistIndex + 1} / ${currentPlaylistSongs.length} 曲目`
    : '';

  const videoId = getYouTubeVideoId(song.url || '');
  if (!isValidYouTubeId(videoId)) {
    message.textContent = '有効なYouTube動画URLを登録してね。';
    playerRoot.replaceChildren();
    ytPlayer = null;
    info.textContent = '';
    return;
  }

  localStorage.setItem(LAST_PLAYED_KEY, JSON.stringify({
  videoId: videoId,
  title: song.title || '',
  artist: song.artist || ''
}));
  
  message.textContent = '再生プレーヤーを読み込み中…';
  info.textContent = `${song.title || ''}${song.artist ? ' / ' + song.artist : ''}`;
  const openPlaylist = document.querySelector(
  '#playlists [data-plsongs]:not([hidden])'
);
  const openPlaylistId = openPlaylist?.dataset.plsongs;

  updatePlayingBadge();

if (openPlaylistId) {
  const playlistToOpen = document.querySelector(
    `#playlists [data-plsongs="${CSS.escape(openPlaylistId)}"]`
  );
  if (playlistToOpen) {
    playlistToOpen.hidden = false;
  }
}
  
  if (ytPlayer) {
    try {
      ytPlayer.loadVideoById(videoId);
      ytPlayer.playVideo();
      message.textContent = '曲を切り替えています…';
      return;
    } catch {
      ytPlayer = null;
    }
  }

  let mount = document.getElementById('youtubePlayerFrame');
  if (!mount) {
    mount = document.createElement('div');
    mount.id = 'youtubePlayerFrame';
    playerRoot.replaceChildren(mount);
  }

  try {
    await loadYouTubeIframeAPI();
    ytPlayer = new YT.Player('youtubePlayerFrame', {
      width: '100%',
      height: '220',
      videoId,
      playerVars: { playsinline: 1, rel: 0, fs: 1, autoplay: 1 },
      events: {
        onReady: () => {
          message.textContent = '再生を開始します…';
          ytPlayer.playVideo();
        },
        onAutoplayBlocked: () => {
          message.textContent = '自動再生が制限されました。画面内の再生ボタンを押してね。';
        },
        /* このイベントは公式APIで保証されていないため、iPhoneでの動作は未確定 */
        onFullscreenChange: event => {
          if (!event.data) return;

          if (event.data.fullscreen === true) {
            wasPlayingBeforeFullscreen = ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
            message.textContent = '全画面で再生中です';
          }

          if (event.data.fullscreen === false) {
            message.textContent = '全画面を終了しました';
            if (
              wasPlayingBeforeFullscreen &&
              ytPlayer &&
              ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING
            ) {
              ytPlayer.playVideo();
            }
            wasPlayingBeforeFullscreen = false;
          }
        },
        onStateChange: event => {
          if (event.data === YT.PlayerState.PLAYING) {
            message.textContent = '再生中です♪';
          }

          if (event.data === YT.PlayerState.ENDED) {
            message.textContent = '曲が終了しました。次の曲を読み込みます…';
            advancePlaylistAfterEnd(message);
          }
        },
        onError: () => {
          message.textContent = 'この動画は埋め込み再生できない可能性があります。';
        }
      }
    });
  } catch {
    message.textContent = 'YouTubeプレーヤーを読み込めませんでした。ページを再読み込みしてね。';
  }
}

function advancePlaylistAfterEnd(message) {
  if (
    !currentPlaylistSongs.length ||
    currentPlaylistIndex < 0 ||
    currentPlaylistIndex >= currentPlaylistSongs.length
  ) {
    message.textContent = '曲が終了しました。プレイリストを選択すると自動で次の曲へ進めます。';
    return;
  }

  const isLastSong = currentPlaylistIndex === currentPlaylistSongs.length - 1;
  if (isLastSong && isShuffleMode && currentPlaylistSongs.length > 1) {
    const previousSongId = currentPlaylistSongs[currentPlaylistIndex].id;

    for (let i = currentPlaylistSongs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentPlaylistSongs[i], currentPlaylistSongs[j]] = [currentPlaylistSongs[j], currentPlaylistSongs[i]];
    }

    if (currentPlaylistSongs[0].id === previousSongId) {
      const differentIndex = currentPlaylistSongs.findIndex((song, index) =>
        index > 0 && song.id !== previousSongId
      );
      if (differentIndex > 0) {
        [currentPlaylistSongs[0], currentPlaylistSongs[differentIndex]] =
          [currentPlaylistSongs[differentIndex], currentPlaylistSongs[0]];
      }
    }
    currentPlaylistIndex = 0;
  } else {
    currentPlaylistIndex = (currentPlaylistIndex + 1) % currentPlaylistSongs.length;
  }

  const nextSong = currentPlaylistSongs[currentPlaylistIndex];
  if (nextSong && nextSong.url) {
    playInApp(nextSong);
  } else {
    message.textContent = '次の曲にYouTube URLが登録されていません。';
  }
}

  switch (button.dataset.act) {
case 'play':
  currentPlaylistSongs = [song];
  currentPlaylistIndex = 0;

  playInApp(song);
  render();
  break;

    case 'edit': {

        '_blank',
        'noopener'
      );

      render();

      songs = songs.filter(item => item.id !== song.id);

        playlist.songIds = playlist.songIds.filter(id => id !== song.id);

case 'playlist': {

    });

    options.appendChild(button);

  modal.hidden = false;

document.getElementById('libraryShuffleBtn').addEventListener('click', () => {
  const visibleIds = [...document.querySelectorAll('#songs article.song')]
    .map(element => element.dataset.songid);
  const librarySongs = visibleIds
    .map(id => songs.find(song => String(song.id) === String(id)))
    .filter(song => song && song.url);

  if (!librarySongs.length) {
    alert('ランダム再生できる曲がありません。');
    return;
  }

  currentPlaylistSongs = [...librarySongs];

  for (let i = currentPlaylistSongs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentPlaylistSongs[i], currentPlaylistSongs[j]] =
      [currentPlaylistSongs[j], currentPlaylistSongs[i]];
  }

  const lastPlayed = load(LAST_PLAYED_KEY, null);
  if (
    currentPlaylistSongs.length > 1 &&
    lastPlayed?.videoId &&
    getYouTubeVideoId(currentPlaylistSongs[0].url || '') === lastPlayed.videoId
  ) {
    const differentIndex = currentPlaylistSongs.findIndex(song =>
      getYouTubeVideoId(song.url || '') !== lastPlayed.videoId
    );
    if (differentIndex > 0) {
      [currentPlaylistSongs[0], currentPlaylistSongs[differentIndex]] =
        [currentPlaylistSongs[differentIndex], currentPlaylistSongs[0]];
    }
  }

  currentPlaylistIndex = 0;
  isShuffleMode = true;
  playInApp(currentPlaylistSongs[currentPlaylistIndex]);
  render();
});

document.getElementById('playlists').addEventListener('click', event => {
  const button = event.target.closest('button');

  if (!button) {
    const title = event.target.closest('.playlist-song-title');
    if (!title) return;

    selectSong(title.dataset.songid);
    renderPlaylists();
    return;
  }

  const playlist = playlists.find(item => item.id === button.dataset.id);
  if (!playlist) return;

  const action = button.dataset.plact;

  if (action === 'delete') {
    if (!confirm('このプレイリストを削除しますか？')) return;

    playlists = playlists.filter(item => item.id !== playlist.id);

    if (
      currentPlaylistSongs.length &&
      currentPlaylistSongs.every(song => playlist.songIds.includes(song.id))
    ) {
      currentPlaylistSongs = [];
      currentPlaylistIndex = -1;
      isShuffleMode = false;
    }

    save();
    render();
    return;
  }

if (action === 'toggle') {
  const list = document.querySelector(
    `[data-plsongs="${CSS.escape(playlist.id)}"]`
  );

if (list) {
  const shouldOpen = list.hidden;

    document.querySelectorAll('[data-plsongs]').forEach(item => {
      item.hidden = true;
    });

    document.querySelectorAll('.playlist-toggle').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
      button.textContent = '▶ ' + button.textContent.trim().replace(/^[▼▶]\s*/, '');
    });

    if (shouldOpen) {
      list.hidden = false;

      const toggle = document.querySelector(
        `.playlist-toggle[data-id="${CSS.escape(playlist.id)}"]`
      );

      if (toggle) {
        toggle.setAttribute('aria-expanded', 'true');
        toggle.textContent = '▼ ' + toggle.textContent.trim().replace(/^[▼▶]\s*/, '');
      }
    }
  }

  return;
}

  const songId = button.dataset.songid;

  if (action === 'up' || action === 'down' || action === 'remove') {
    const index = playlist.songIds.findIndex(id => String(id) === String(songId));
    if (index < 0) return;

    if (action === 'remove') {
      if (!confirm('この曲をプレイリストから削除しますか？')) return;
      playlist.songIds.splice(index, 1);
    } else {
      const newIndex = action === 'up' ? index - 1 : index + 1;
      if (newIndex < 0 || newIndex >= playlist.songIds.length) return;

      [playlist.songIds[index], playlist.songIds[newIndex]] =
        [playlist.songIds[newIndex], playlist.songIds[index]];
    }

    save();
    renderPlaylists();
    return;
  }

const playlistSongs = getPlaylistSongs(playlist);

  if (action === 'play') {
    const index = playlistSongs.findIndex(
      song => String(song.id) === String(songId)
    );

    if (index < 0) {
      alert('この曲は見つかりませんでした。');
      return;
    }

    currentPlaylistSongs = playlistSongs;
    currentPlaylistIndex = index;
    isShuffleMode = false;
    playInApp(currentPlaylistSongs[currentPlaylistIndex]);
    return;
  }

  if (!['prev', 'next', 'shuffle'].includes(action)) return;

  if (!playlistSongs.length) {
    alert('このプレイリストには曲がありません。');
    return;
  }

  if (action === 'shuffle') {
    isShuffleMode = true;
    currentPlaylistSongs = [...playlistSongs];

    for (let i = currentPlaylistSongs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentPlaylistSongs[i], currentPlaylistSongs[j]] =
        [currentPlaylistSongs[j], currentPlaylistSongs[i]];
    }

    currentPlaylistIndex = 0;
  } else {
    const samePlaylist =
      currentPlaylistSongs.length === playlistSongs.length &&
      currentPlaylistSongs.every(
        (song, index) => song.id === playlistSongs[index].id
      );

    if (!samePlaylist) {
      currentPlaylistSongs = playlistSongs;
      currentPlaylistIndex = action === 'next' ? -1 : 0;
      isShuffleMode = false;
    }

    currentPlaylistIndex = action === 'next'
      ? (currentPlaylistIndex + 1) % currentPlaylistSongs.length
      : (currentPlaylistIndex - 1 + currentPlaylistSongs.length) %
        currentPlaylistSongs.length;
  }

  const song = currentPlaylistSongs[currentPlaylistIndex];

  if (!song.url) {
    alert('この曲にはYouTubeのURLが登録されていません。曲を編集してURLを登録してね。');
    return;
  }

  playInApp(song);
});

/* バックアップ */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ songs, playlists }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'my_music_player_backup.json';
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.songs) || !Array.isArray(data.playlists)) throw new Error('Invalid backup');

    if (confirm('現在のライブラリをバックアップの内容で置き換えますか？')) {
      songs = data.songs;
      playlists = data.playlists;
      save();
      render();
    }
  } catch {
    alert('バックアップファイルを読み込めませんでした');
  }
  event.target.value = '';
});

/* 背景色・写真背景 */
const backgroundMode = document.getElementById('backgroundMode');
const backgroundColor = document.getElementById('backgroundColor');
const backgroundImage = document.getElementById('backgroundImage');
const solidSettings = document.getElementById('solidBackgroundSettings');
const imageSettings = document.getElementById('imageBackgroundSettings');

function applyBackground() {
  const useImage = backgroundMode.value === 'image';
  document.body.classList.toggle('photo-background', useImage);
  solidSettings.hidden = useImage;
  imageSettings.hidden = !useImage;

  if (useImage) {
    document.body.style.backgroundImage = document.body.dataset.backgroundImage || 'none';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = backgroundColor.value;
  }
}

function saveBackgroundSettings() {
  try {
    localStorage.setItem(BG_MODE_KEY, backgroundMode.value);
    localStorage.setItem(BG_COLOR_KEY, backgroundColor.value);
  } catch {
    console.warn('背景設定を保存できませんでした。');
  }
}

function loadBackgroundSettings() {
  try {
    const mode = localStorage.getItem(BG_MODE_KEY);
    const color = localStorage.getItem(BG_COLOR_KEY);
    if (mode === 'solid' || mode === 'image') backgroundMode.value = mode;
    if (color && /^#[0-9a-fA-F]{6}$/.test(color)) backgroundColor.value = color;
  } catch {
    console.warn('背景設定を読み込めませんでした。');
  }
}

function openBackgroundDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(BG_DB_NAME, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(BG_STORE_NAME)) {
        request.result.createObjectStore(BG_STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveBackgroundImage(file) {
  const db = await openBackgroundDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(BG_STORE_NAME, 'readwrite');
    transaction.objectStore(BG_STORE_NAME).put(file, BG_IMAGE_KEY);
    transaction.oncomplete = () => { db.close(); resolve(); };
    transaction.onerror = () => { db.close(); reject(transaction.error); };
    transaction.onabort = () => { db.close(); reject(transaction.error); };
  });
}

async function loadBackgroundImage() {
  const db = await openBackgroundDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(BG_STORE_NAME, 'readonly');
    const request = transaction.objectStore(BG_STORE_NAME).get(BG_IMAGE_KEY);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
    transaction.oncomplete = () => db.close();
    transaction.onerror = () => db.close();
  });
}

function showBackgroundImage(dataUrl) {
  document.body.dataset.backgroundImage = `url("${dataUrl}")`;
}

backgroundMode.addEventListener('change', () => {
  applyBackground();
  saveBackgroundSettings();
});
backgroundColor.addEventListener('input', () => {
  applyBackground();
  saveBackgroundSettings();
});

backgroundImage.addEventListener('change', async () => {
  const file = backgroundImage.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('画像ファイルを選んでね。');
    backgroundImage.value = '';
    return;
  }

  try {
    await saveBackgroundImage(file);
    const reader = new FileReader();
    reader.onload = () => {
      showBackgroundImage(reader.result);
      backgroundMode.value = 'image';
      applyBackground();
      saveBackgroundSettings();
    };
    reader.onerror = () => alert('写真を読み込めませんでした。');
    reader.readAsDataURL(file);
  } catch {
    alert('写真を保存できませんでした。別の写真で試してね。');
  }
});

async function restoreBackgroundImage() {
  try {
    const savedImage = await loadBackgroundImage();
    if (!savedImage) {
      applyBackground();
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      showBackgroundImage(reader.result);
      applyBackground();
    };
    reader.onerror = () => applyBackground();
    reader.readAsDataURL(savedImage);
  } catch {
    console.warn('背景写真を復元できませんでした。');
    applyBackground();
  }
}

async function prepareLastPlayedPlayer() {
  let savedSong;

  try {
    savedSong = JSON.parse(localStorage.getItem(LAST_PLAYED_KEY) || 'null');
  } catch {
    return;
  }

  if (!savedSong || !isValidYouTubeId(savedSong.videoId)) {
    return;
  }

  const playerRoot = document.getElementById('youtubePlayer');
  const message = document.getElementById('playerMessage');
  const info = document.getElementById('playerInfo');
  const playerAccordion = document.getElementById('playerPanel')
    .closest('details.accordion');

  playerAccordion.open = true;

  let mount = document.getElementById('youtubePlayerFrame');
  if (!mount) {
    mount = document.createElement('div');
    mount.id = 'youtubePlayerFrame';
    playerRoot.replaceChildren(mount);
  }

  try {
    await loadYouTubeIframeAPI();

    if (ytPlayer) return;

    ytPlayer = new YT.Player('youtubePlayerFrame', {
      width: '100%',
      height: '220',
      videoId: savedSong.videoId,
      playerVars: {
        playsinline: 1,
        rel: 0,
        fs: 1,
        autoplay: 0
      },
      events: {
        onReady: () => {
          ytPlayer.cueVideoById(savedSong.videoId);
          info.textContent =
            `${savedSong.title || '前回の曲'}${savedSong.artist ? ' / ' + savedSong.artist : ''}`;
          message.textContent =
            '前回の曲を準備しました。再生ボタンで開始できます。';
        },
        onAutoplayBlocked: () => {
          message.textContent =
            '自動再生が制限されました。画面内の再生ボタンを押してね。';
        },
        onFullscreenChange: event => {
          if (!event.data) return;

          if (event.data.fullscreen === true) {
            wasPlayingBeforeFullscreen =
              ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
            message.textContent = '全画面で再生中です';
          }

          if (event.data.fullscreen === false) {
            message.textContent = '全画面を終了しました';
            if (
              wasPlayingBeforeFullscreen &&
              ytPlayer &&
              ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING
            ) {
              ytPlayer.playVideo();
            }
            wasPlayingBeforeFullscreen = false;
          }
        },
        onStateChange: event => {
          if (event.data === YT.PlayerState.PLAYING) {
            message.textContent = '再生中です♪';
          }

          if (event.data === YT.PlayerState.ENDED) {
            message.textContent =
              '曲が終了しました。次の曲を読み込みます…';
            advancePlaylistAfterEnd(message);
          }
        },
        onError: () => {
          message.textContent =
            'この動画は埋め込み再生できない可能性があります。';
        }
      }
    });
  } catch {
    message.textContent = 'プレーヤーを準備できませんでした。';
  }
}

loadBackgroundSettings();
restoreBackgroundImage();
render();
prepareLastPlayedPlayer();

/* iPhone Safariでの初回再生を助けるため、APIを先読みする */
loadYouTubeIframeAPI().catch(() => {});
